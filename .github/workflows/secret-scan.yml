name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Independent gate: fails only on current-checkout / working-tree findings.
# Does not scan full Git history (rotated historical secrets must not block merges).
jobs:
  gitleaks:
    name: gitleaks-working-tree
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret scan (working tree)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          chmod +x scripts/security-secrets.sh
          ./scripts/security-secrets.sh
