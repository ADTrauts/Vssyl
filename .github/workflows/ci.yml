name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vssyl_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vssyl_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vssyl_ci
      JWT_SECRET: ci-jwt-secret-must-be-at-least-32-chars
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-32chars-minimum
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        working-directory: ./shared
      - run: pnpm prisma:generate
      - run: pnpm exec prisma migrate deploy --schema prisma/schema.prisma
      - run: pnpm type-check
      - run: pnpm test